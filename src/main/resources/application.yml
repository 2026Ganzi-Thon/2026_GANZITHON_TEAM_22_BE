spring:
  flyway:
    enabled: false
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: ${GANZI_DB_INIT_MODE:never}
      schema-locations: classpath:schema-mysql.sql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  address: ${GANZI_BIND_ADDRESS:127.0.0.1}
  port: ${GANZI_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
ganzi:
  push:
    enabled: ${GANZI_PUSH_ENABLED:false}
    expo-access-token: ${GANZI_EXPO_ACCESS_TOKEN:}
    dispatch-interval-ms: ${GANZI_PUSH_DISPATCH_INTERVAL_MS:15000}
  auth:
    days: 30
  chat:
    enabled: ${GANZI_CHAT_ENABLED:false}
    intent-routing-enabled: ${GANZI_CHAT_INTENT_ROUTING_ENABLED:true}
    provider: openai
    memory:
      archive-enabled: ${GANZI_CHAT_ARCHIVE_ENABLED:true}
      archive-interval-ms: ${GANZI_CHAT_ARCHIVE_INTERVAL_MS:60000}
      archive-initial-delay-ms: ${GANZI_CHAT_ARCHIVE_INITIAL_DELAY_MS:60000}
    budget:
      scope: ${GANZI_CHAT_BUDGET_SCOPE:openai}
      daily-usd: ${GANZI_CHAT_DAILY_USD:1}
      monthly-usd: ${GANZI_CHAT_MONTHLY_USD:10}
      user-daily-requests: ${GANZI_CHAT_USER_DAILY_REQUESTS:100}
      billing-epoch: ${GANZI_CHAT_BILLING_EPOCH:1}
    response-deadline-seconds: ${GANZI_CHAT_RESPONSE_DEADLINE_SECONDS:30}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${GANZI_OPENAI_MODEL:gpt-6.1-sol}
    reasoning-effort: ${GANZI_OPENAI_REASONING_EFFORT:}
    timeout-seconds: ${GANZI_OPENAI_TIMEOUT_SECONDS:20}
    max-output-tokens: ${GANZI_OPENAI_MAX_OUTPUT_TOKENS:2048}
  rate-limit:
    enabled: ${GANZI_RATE_LIMIT_ENABLED:true}
    global-per-minute: ${GANZI_RATE_LIMIT_GLOBAL_PER_MINUTE:120}
    guest-per-hour: ${GANZI_RATE_LIMIT_GUEST_PER_HOUR:30}
    auth-per-minute: ${GANZI_RATE_LIMIT_AUTH_PER_MINUTE:10}
    max-entries: ${GANZI_RATE_LIMIT_MAX_ENTRIES:10000}
  cors:
    allowed-origins: ${GANZI_ALLOWED_ORIGINS:http://127.0.0.1:7891,http://localhost:7891}
